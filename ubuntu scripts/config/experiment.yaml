version: 1

mavlink:
  # PX4 SITL "Normal" link typically sends to remote UDP 14550.
  listen_port: 14550

logging:
  rate_hz: 50
  duration_s_default: 30.0

scenarios:
  # Must match keys in `config/ref_traj.yaml`
  - hover
  - excitation

quantization:
  enabled: true
  b_list: [4, 8, 12, 14, 16]
  seeds: [1, 2, 3, 4, 5]
  bounds_yaml: "ubuntu scripts/config/quantization_bounds.yaml"
  safety_margin_frac: 0.05

trials_per_setting: 2

paths:
  out_root: "ubuntu scripts/outputs"
  run_manifest_name: "manifest.json"
